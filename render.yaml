# Render free tier has an ephemeral filesystem and sleeps after 15 min.
# GitHub Actions is the primary scheduler. Use Render only for manual or long-running invocations.
services:
  - type: worker
    name: auto-post
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PUBLISH_BACKEND
        value: queue
      - key: META_PAGE_ID
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: POSTIZ_BASE_URL
        sync: false
      - key: POSTIZ_API_KEY
        sync: false
