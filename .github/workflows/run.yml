name: Auto Post

on:
  schedule:
    # 9:17 a.m., 1:17 p.m., 7:17 p.m. Fort Wayne time. The posting_window
    # job selects the right UTC schedule for daylight or standard time.
    - cron: "17 13,17,23 * * *"
    - cron: "17 0,14,18 * * *"
    # Poll bookings and custody on a frequent schedule; at most one new booking per run.
    - cron: "*/15 * * * *"
    # Daily custody scan fallback.
    - cron: "17 12 * * *"
    - cron: "17 13 * * *"
    # One Allen County Fugitive of the Day post at 4:17 p.m. Fort Wayne time.
    - cron: "17 20 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview skips publishing; check-facebook only checks Page identity"
        type: choice
        options: [preview, check-facebook, publish, preview-status, check-status]
        default: preview
      limit:
        description: "Maximum records attempted in this run"
        type: number
        default: 1
      source_type:
        description: "Booking roster or warrants (warrants require a verified configured source)"
        type: choice
        options: [booking, warrant, all]
        default: booking

permissions:
  contents: read

concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  posting_window:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.window.outputs.run }}
      mode: ${{ steps.window.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Fort Wayne posting schedule
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 -m core.posting_schedule
  run:
    needs: posting_window
    # Keep manual runs available and run configured scheduled Meta jobs automatically.
    if: >-
      needs.posting_window.outputs.run == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       vars.PUBLISH_BACKEND == 'meta' ||
       (needs.posting_window.outputs.mode == 'publish' && vars.PUBLISH_BACKEND != 'meta'))
    # Match the supported OS of the pinned Playwright release.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PUBLISH_BACKEND: ${{ vars.PUBLISH_BACKEND || 'queue' }}
      BROWSER_PLATFORM: ${{ vars.BROWSER_PLATFORM || 'x' }}
      # Include all current inmates, even if an old repository variable was set to 3.
      MAX_AGE_DAYS: '0'
      MAX_PER_RUN: ${{ vars.MAX_PER_RUN || '1' }}
      SKIP_UNDER_18: ${{ vars.SKIP_UNDER_18 || 'false' }}
      X_USERNAME: ${{ secrets.X_USERNAME }}
      X_PASSWORD: ${{ secrets.X_PASSWORD }}
      FACEBOOK_EMAIL: ${{ secrets.FACEBOOK_EMAIL }}
      FACEBOOK_PASSWORD: ${{ secrets.FACEBOOK_PASSWORD }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
      POSTIZ_BASE_URL: ${{ secrets.POSTIZ_BASE_URL }}
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Cache Playwright browsers
        if: inputs.mode != 'check-facebook'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
      - name: Install Chromium
        if: inputs.mode != 'check-facebook'
        run: python -m playwright install --with-deps chromium
      - name: Restore delivery database
        id: database
        uses: actions/cache/restore@v4
        with:
          path: autopost.db
          key: delivery-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            delivery-db-
            autopost-db-
      - name: Hydrate storage state
        if: inputs.mode != 'check-facebook'
        env:
          STORAGE_STATE_B64: ${{ secrets.STORAGE_STATE_B64 }}
        run: |
          if [ -n "$STORAGE_STATE_B64" ]; then
            mkdir -p storage_state
            printf '%s' "$STORAGE_STATE_B64" | base64 -d > storage_state/combined.json
          fi
      - name: Run selected action
        env:
          RUN_MODE: ${{ inputs.mode || needs.posting_window.outputs.mode }}
          # Scheduled runs publish at most one record; manual runs use the chosen limit.
          RUN_LIMIT: ${{ github.event_name == 'schedule' && '1' || inputs.limit || vars.MAX_PER_RUN || '1' }}
          SOURCE_TYPE: ${{ inputs.source_type || 'booking' }}
        run: |
          case "$RUN_MODE" in
            check-facebook) python main.py --check-facebook ;;
            preview) python main.py --dry-run --limit "$RUN_LIMIT" --source-type "$SOURCE_TYPE" ;;
            publish) python main.py --limit "$RUN_LIMIT" --source-type "$SOURCE_TYPE" ;;
            publish-wanted) python main.py --limit 1 --source-type warrant ;;
            preview-status) python main.py --check-status --dry-run ;;
            check-status) python main.py --check-status ;;
            publish-and-check)
              python main.py --limit "$RUN_LIMIT" --source-type booking &&
              python main.py --check-status
              ;;
            *) echo "Unknown action" >&2; exit 1 ;;
          esac
      # Save successes AND uncertain outcomes even when another record failed.
      - name: Save delivery database
        if: always() && steps.database.outcome == 'success' && hashFiles('autopost.db') != ''
        uses: actions/cache/save@v4
        with:
          path: autopost.db
          key: delivery-db-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outbox
          path: outbox/
          retention-days: 30
          if-no-files-found: ignore
